services:
  - type: web
    name: tequi-la-la-portal
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tequi-la-la-db
          property: connectionString

databases:
  - name: tequi-la-la-db
    plan: free
    region: frankfurt
    databaseName: tequilala
    user: tequilala
